name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  RUBY_VERSION: "4.0"
  BUN_VERSION: "1.3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint and Static Analysis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

  ruby-tests:
    runs-on: ubuntu-latest
    name: Ruby Tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Run Ruby unit tests
        run: bundle exec rspec spec/units --format progress --format json --out tmp/rspec-results.json

      - name: Upload Ruby test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruby-test-results
          path: tmp/rspec-results.json

  typescript-tests:
    runs-on: ubuntu-latest
    name: TypeScript Tests (Bun)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install workspace dependencies with npm (bun optionalDependencies workaround for rolldown/rollup native bindings)
        run: npm install --no-save --no-package-lock

      - name: Create tmp directory for test results
        run: mkdir -p tmp

      - name: Build TypeScript package with Bun
        working-directory: universal-renderer
        run: bun run build

      - name: Verify package entry points
        working-directory: universal-renderer
        run: bun run test:package

      - name: Run TypeScript tests with Bun
        working-directory: universal-renderer
        run: bun run test -- --reporter=junit --reporter.outputFile=../tmp/bun-test-results.xml

      - name: Upload Bun test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bun-test-results
          path: tmp/bun-test-results.xml

  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: [ruby-tests, typescript-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install workspace dependencies with npm (bun optionalDependencies workaround for rolldown/rollup native bindings)
        run: npm install --no-save --no-package-lock

      - name: Create tmp directory for test results
        run: mkdir -p tmp

      - name: Build package for integration tests with Bun
        working-directory: universal-renderer
        run: bun run build

      - name: Run integration tests
        run: |
          bundle exec rspec spec/integration --format progress --format json --out tmp/integration-results-bun.json

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results-bun
          path: tmp/integration-results-bun.json

  test-summary:
    runs-on: ubuntu-latest
    name: Test Summary Report
    needs: [lint, ruby-tests, typescript-tests, integration-tests]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-results/

      - name: Generate test summary
        run: |
          .github/scripts/generate-test-summary.sh \
            "${{ needs.ruby-tests.result }}" \
            "${{ needs.typescript-tests.result }}" \
            "${{ needs.integration-tests.result }}"
